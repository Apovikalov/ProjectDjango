{% extends 'catalog/base.html' %}

{% block title %} Список продуктов в категории {% endblock %}

{% block content %}
<h1> Список продуктов в категории {{category.name}} </h1>
<ul>
    {% for product in product_list %}
        <li>{{product.name}}</li>
    {% endfor %}
</ul>
<a href="{% url 'home' %}" class="btn btn-primary">Назад к списку продуктов</a>
{% endblock %}
